# ============================================
# TEST PROFILE - NO EXTERNAL DATABASES REQUIRED
# ============================================

# MongoDB is mocked in the context test, so its auto-configuration is disabled.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.mongo.MongoReactiveAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoReactiveDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoReactiveRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# MySQL (R2DBC) is replaced by H2 in tests.
spring.r2dbc.url=r2dbc:h2:mem:///testdb?options=DB_CLOSE_DELAY=-1;MODE=MySQL
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.r2dbc.properties.sslMode=DISABLED
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=10

# SQL Init - not needed for unit/slice tests.
spring.sql.init.mode=never

# Logging
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.r2dbc=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.it.academy.blackjack=DEBUG
